# Every push to main builds the Windows app and publishes it as a GitHub release.
# Installed apps find it there and update themselves.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # Version is the base version from package.json with the run number as patch: 0.1.0 → 0.1.<run>.
      - name: Set version
        id: version
        shell: bash
        run: |
          bun -e "const p = await Bun.file('package.json').json(); p.version = p.version.split('.').slice(0, 2).join('.') + '.${{ github.run_number }}'; await Bun.write('package.json', JSON.stringify(p, null, 2) + '\n')"
          echo "version=$(bun -e "console.log(require('./package.json').version)")" >> "$GITHUB_OUTPUT"

      - run: bun run build

      - run: bunx --bun electron-builder --win --publish never

      # Published in one go: electron-builder's own publishing uploads in parallel, and each
      # upload tries to create the release. latest.yml is what installed apps check for updates.
      # The notes are the commit titles since the last release, without the conventional prefix;
      # the app shows them as a list when hovering the update button.
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          previous=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          {
            echo "## Was ist neu"
            echo
            git log --no-merges --format=%s ${previous:+"$previous..HEAD"} \
              | grep -vE '^(chore|ci|test|docs|refactor|build|style)(\(|!|:)' \
              | sed -E 's/^[a-z]+(\([^)]*\))?!?: //; s/^(.)/\U\1/; s/^/- /' || true
            if [ -n "$previous" ]; then
              echo
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$previous...v$VERSION"
            fi
          } > notes.md
          gh release create "v$VERSION" \
            "release/FSD-Tools-Setup-$VERSION.exe" \
            "release/FSD-Tools-Setup-$VERSION.exe.blockmap" \
            release/latest.yml \
            --title "$VERSION" --target "$GITHUB_SHA" --notes-file notes.md
