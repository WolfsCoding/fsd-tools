# Every push to main builds the Windows app and publishes it as a GitHub release.
# Installed apps find it there and update themselves.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # Version is the base version from package.json with the run number as patch: 0.1.0 → 0.1.<run>.
      - name: Set version
        id: version
        shell: bash
        run: |
          bun -e "const p = await Bun.file('package.json').json(); p.version = p.version.split('.').slice(0, 2).join('.') + '.${{ github.run_number }}'; await Bun.write('package.json', JSON.stringify(p, null, 2) + '\n')"
          echo "version=$(bun -e "console.log(require('./package.json').version)")" >> "$GITHUB_OUTPUT"

      - run: bun run build

      - run: bunx --bun electron-builder --win --publish never

      # Published in one go: electron-builder's own publishing uploads in parallel, and each
      # upload tries to create the release. latest.yml is what installed apps check for updates.
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            "release/FSD-Tools-Setup-$VERSION.exe" \
            "release/FSD-Tools-Setup-$VERSION.exe.blockmap" \
            release/latest.yml \
            --title "$VERSION" --target "$GITHUB_SHA" --generate-notes
